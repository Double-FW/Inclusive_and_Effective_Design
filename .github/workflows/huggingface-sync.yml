name: Sync Inclusive and Effective Design dataset

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "LICENSE"
      - "Inclusive_Digital_Service_Outcome_Dataset.md"
      - "Accessible_Fonts_and_Typography.md"
      - "E-Commerce Customer Lifecycle.md"
      - "Inclusive_Design_Practice.md"
      - "Understanding Forms as Cognitive Journeys.md"
      - "The WCAG POUR principles reframed through emotional outcomes for branding systems.md"
      - "huggingface/export-config.json"
      - "huggingface/requirements.txt"
      - "scripts/sync_huggingface.py"
      - ".github/workflows/huggingface-sync.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inclusive-effective-design-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Inclusive_and_Effective_Design' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_DATASET_ID: GarethFW/Inclusive_and_Effective_Design
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install publishing dependency
        run: python -m pip install -r huggingface/requirements.txt
      - name: Check fixed destination and validate export
        run: python scripts/sync_huggingface.py --mode check --dataset-id "$HF_DATASET_ID"
      - name: Build dataset files
        run: python scripts/sync_huggingface.py --mode build --output "$RUNNER_TEMP/inclusive-effective-design-dataset" --dataset-id "$HF_DATASET_ID"
      - name: Publish to the existing dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_huggingface.py --mode publish --folder "$RUNNER_TEMP/inclusive-effective-design-dataset" --dataset-id "$HF_DATASET_ID"
